#!/usr/bin/env bash
#
# Version: 0.26.2
# Purpose: Versioned prerequisites manifest for evi installation.
# Sourced by install.sh during the deploy step and by sync-host-prerequisites.sh during
# updates to determine required system packages, kernel settings, and firewall rules
# for this evi release.
# Deployment file: prerequisites.conf
#
# Changes in v0.26.2:
# - Rename EVI_* configuration keys and template placeholders to APP_* (EVI_APP_DB_PASSWORD becomes APP_DB_PASSWORD).
# 
# Changes in v0.23.12:
# - Add PREREQ_JOURNAL_MAX_USE / PREREQ_JOURNAL_MAX_FILE_SIZE / PREREQ_JOURNAL_MAX_RETENTION
#   for the host journald drop-in (/etc/systemd/journald.conf.d/app-logs.conf).
#
# Changes in v0.23.10:
# - Add fail2ban and python3-systemd to EVI_PREREQ_APT_PACKAGES. Package install
#   alone is not enough; the kit sshd jail is configured by scripts/install-fail2ban.sh.
#
# Changes in v0.23.8:
# - Pin official Cockpit File browser (cockpit-files) for install-cockpit-files.sh.
#   Not listed in EVI_PREREQ_COCKPIT_PACKAGES (absent on Debian 12; helper is best-effort).
#
# Changes in v0.21.8:
# - Add jq to EVI_PREREQ_APT_PACKAGES for robust JSON parsing of GitHub release notes
#   (list-releases.sh / check-updates.sh). Not a breaking change; synced automatically
#   to existing servers via sync-host-prerequisites.sh on the next update.
#
# Changes in v1.0.3:
# - Add ufw to EVI_PREREQ_APT_PACKAGES so minimal hosts install the firewall tool.
#
# Changes in v1.0.2:
# - Update-kit now syncs host prerequisites on every update via sync-host-prerequisites.sh.
#   Existing servers no longer need manual `sudo apt-get install` for new packages.
#
# Changes in v1.0.1:
# - Add apache2-utils to EVI_PREREQ_APT_PACKAGES (htpasswd bcrypt for Cockpit evi-admin password reset).
# - Upgrade note: update-kit does not install apt packages; on existing servers run
#   `sudo apt-get install -y apache2-utils` or re-run install.sh deploy/prerequisites with a kit that ships this manifest.
#
# Changes in v1.0.0:
# - Initial manifest: apt packages, cockpit packages, sysctl port, UFW ports.
#
# Each evi release ships its own prerequisites.conf inside the kit archive.
# install.sh sources this file to dynamically install the correct prerequisites
# for the selected release version, rather than using a hardcoded list.

# System packages required by evi (installed via apt-get)
# fail2ban + python3-systemd: package install alone is not enough.
# The kit sshd jail is configured by scripts/install-fail2ban.sh.
APP_PREREQ_APT_PACKAGES="podman uidmap curl openssl apache2-utils ufw jq fail2ban python3-systemd"

# Cockpit packages (installed via apt-get; cockpit provides the web management UI)
APP_PREREQ_COCKPIT_PACKAGES="cockpit cockpit-podman"

# Official Cockpit File browser (optional). Installed only via install-cockpit-files.sh,
# never via APP_PREREQ_COCKPIT_PACKAGES (the package is missing on Debian 12).
APP_PREREQ_COCKPIT_FILES_PACKAGE="cockpit-files"
APP_PREREQ_COCKPIT_FILES_RELEASE="44"
APP_PREREQ_COCKPIT_FILES_DEB_URL="http://ftp.debian.org/debian/pool/main/c/cockpit-files/cockpit-files_44-1_all.deb"

# Minimum unprivileged port number (sysctl net.ipv4.ip_unprivileged_port_start)
# Rootless Podman containers need to bind ports 80 and 443 without root.
APP_PREREQ_UNPRIVILEGED_PORT_START=80

# UFW firewall ports to open for the application (space-separated)
APP_PREREQ_UFW_PORTS="80/tcp 443/tcp"

# systemd-journald caps for container/host logs (drop-in: /etc/systemd/journald.conf.d/app-logs.conf)
PREREQ_JOURNAL_MAX_USE="2G"
PREREQ_JOURNAL_MAX_FILE_SIZE="128M"
PREREQ_JOURNAL_MAX_RETENTION="30day"
