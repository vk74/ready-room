# Version: 0.23.9
# Purpose: Valkey server config for evi-state (AOF persistence, cache + event-bus streams).
# File: valkey.conf (deploy kit copy; keep in sync with repo root state/valkey.conf)
# Logic: /data is a named Podman volume. AOF on, RDB off. Password injected at runtime via --include (not in this file).
#
# Changes in v0.23.9:
# - maxmemory is a render placeholder filled from APP_LIMIT_MEM_STATE (empty → 50mb).
#
# Changes in v1.5.0:
# - Enabled AOF persistence (appendonly yes, appendfsync everysec) with auto-rewrite
#   (percentage 100, min-size 64mb). RDB snapshots stay disabled (save "").
# - maxmemory reduced from 256mb to 100mb: ~20 MB existing cache + ~80 MB stream
#   headroom (~80k untrimmed entries) per the event-bus persistence budget.
#
# Changes in v1.4.1:
# - Deploy kit copy: added under deploy/state/ so sparse-checkout deploy includes it; install.sh copies to config/state/valkey/
#
# Changes in v1.4.0:
# - maxmemory set to 256mb: covers current cache (~20 MB at 10K users) plus headroom for
#   evi-worker streams when implemented; fits comfortably on 8 GB host (~3% of total RAM)
#
# Changes in v1.3.0:
# - Disabled persistence: save "" (no RDB), appendonly no (no AOF)
# - Added lazyfree for non-blocking eviction/expiry: lazyfree-lazy-eviction, lazyfree-lazy-expire, lazyfree-lazy-user-del
# - Config tuned for maximum cache speed; data is lost on restart
#
# Changes in v1.1.0:
# - Added maxmemory 1gb to prevent unbounded disk usage by dump.rdb and appendonly.aof
# - Added maxmemory-policy volatile-lru: evicts only keys with TTL (caches), never stream/queue keys
#
# Changes in v1.0.0:
# - Initial config: hybrid persistence, internal bind
#

# Listen on all interfaces inside the container (no host port published)
bind 0.0.0.0
port 6379

# --- Memory limit ---
# Renderer (deploy_render_valkey_conf) fills maxmemory from APP_LIMIT_MEM_STATE
# (empty → 50mb). volatile-lru evicts TTL keys only (refresh tokens, settings,
# permissions); stream keys have no TTL.
maxmemory {{APP_VALKEY_MAXMEMORY}}
maxmemory-policy volatile-lru

# Data directory (named Podman volume in deployment)
dir /data

# --- RDB disabled (no snapshots; AOF only) ---
save ""

# --- AOF (append-only log; rebuilds RAM after restart) ---
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- Lazyfree: non-blocking eviction and expiry for better latency ---
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-user-del yes

# requirepass is set at runtime via --include /tmp/valkey-auth.conf (from Podman secret)
